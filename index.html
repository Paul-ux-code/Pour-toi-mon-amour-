<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mon cœur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: page blanche et aérée, une grande question centrée, puis un calendrier discret. Quelques petits cœurs roses seulement. */
:root {
  --bg: #ffffff;
  --ink: #2b1a22;
  --ink-soft: #7d6a73;
  --pink: #d6336c;
  --pink-soft: #fde8ee;
  --line: #f1dde4;
  --font-display: "Fraunces", "Georgia", serif;
  --font-body: "Nunito", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  position: relative;
  overflow-x: hidden;
}
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
.floaty {
  position: absolute; color: var(--pink);
  animation: bob var(--dur, 8s) ease-in-out var(--delay, 0s) infinite alternate;
}
.floaty svg { width: 100%; height: 100%; display: block; }
@keyframes bob {
  from { transform: translateY(-8px) rotate(-6deg); }
  to   { transform: translateY(10px) rotate(6deg); }
}
.page { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.hero {
  min-height: min(68vh, 540px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center;
}
h1 {
  margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 500;
  font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.15; text-wrap: balance; max-width: 18ch;
}
.choices { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }
.slot { display: inline-block; }
button { font: inherit; cursor: pointer; }
.btn { border-radius: 999px; padding: 13px 32px; font-weight: 800; font-size: 1.05rem; transition: transform .15s ease, background .15s ease; }
.btn:focus-visible, .nav-btn:focus-visible, .day:focus-visible, select:focus-visible, summary:focus-visible, .chip button:focus-visible {
  outline: 3px solid var(--ink); outline-offset: 3px;
}
.btn-yes { background: var(--pink); color: #fff; border: 2px solid var(--pink); }
.btn-yes:hover { transform: translateY(-2px); }
.btn-no { background: #fff; color: var(--ink-soft); border: 2px solid var(--line); }
.btn-no.fixed { position: fixed; z-index: 20; margin: 0; transition: left .28s cubic-bezier(.3, 1.4, .5, 1), top .28s cubic-bezier(.3, 1.4, .5, 1); }
.status { margin: 0; min-height: 1.6em; font-weight: 600; color: var(--pink); text-wrap: balance; }
.meme { display: block; max-width: min(100%, 300px); height: auto; border-radius: 16px; }

/* Calendrier */
.picker { border-top: 1px solid var(--line); }
.picker.pulse { animation: pulse 1s ease 2; }
@keyframes pulse { 50% { background: var(--pink-soft); } }
summary {
  list-style: none; cursor: pointer; padding: 20px 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 1.35rem;
}
summary::-webkit-details-marker { display: none; }
summary .caret { width: 12px; height: 12px; border-right: 2px solid var(--pink); border-bottom: 2px solid var(--pink); transform: rotate(45deg) translate(-3px, -3px); transition: transform .2s ease; flex: none; }
details[open] summary .caret { transform: rotate(-135deg) translate(-3px, -3px); }
.picker-body { padding: 0 0 8px; display: flex; flex-direction: column; gap: 18px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
select { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--pink); font-size: 1.25rem; font-weight: 800; line-height: 1; flex: none; }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; min-width: 280px; }
th { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; padding: 6px 0; }
td { padding: 0; }
.day {
  width: 100%; aspect-ratio: 1; border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--ink);
  font-weight: 600; font-variant-numeric: tabular-nums; transition: background .12s ease;
}
.day:hover:not(:disabled) { background: var(--pink-soft); }
.day:disabled { color: #cfc3c8; cursor: not-allowed; }
.day.on { background: var(--pink); color: #fff; }
.hint { margin: 0; text-align: center; color: var(--ink-soft); font-size: .9rem; }
.chosen { display: flex; flex-wrap: wrap; gap: 8px; min-height: 34px; align-items: center; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--pink-soft); border-radius: 999px; padding: 4px 6px 4px 14px; font-weight: 700; font-size: .9rem; min-width: 0; }
.chip button { border: 0; background: #fff; color: var(--pink); width: 24px; height: 24px; border-radius: 50%; font-weight: 800; line-height: 1; padding: 0; }
.reply { display: flex; flex-direction: column; gap: 10px; }
textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.btn-copy { align-self: center; background: var(--ink); color: #fff; border: 2px solid var(--ink); padding: 11px 26px; font-size: 1rem; }
.btn-copy:disabled { opacity: .35; cursor: not-allowed; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn-forever { background: #fff; color: var(--pink); border: 2px solid var(--pink); font-size: 1rem; padding: 11px 26px; letter-spacing: .04em; }
.btn-forever:hover { background: var(--pink-soft); }
.btn-forever.on { background: var(--pink); color: #fff; }
.btn-done { background: var(--pink); color: #fff; border: 2px solid var(--pink); font-size: 1rem; padding: 11px 26px; }
.btn-done:disabled { opacity: .35; cursor: not-allowed; }
.final { align-self: center; margin-top: 8px; }
.burst { position: fixed; z-index: 30; pointer-events: none; width: 24px; height: 24px; color: var(--pink); animation: fly 1.3s ease-out forwards; }
.burst svg { width: 100%; height: 100%; display: block; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.6); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .floaty, .picker.pulse { animation: none; }
  .btn-no.fixed, .btn, .day, summary .caret { transition: none; }
  .burst { display: none; }
}
@media (max-width: 460px) {
  th { font-size: .62rem; letter-spacing: .03em; }
  .day { font-size: .95rem; }
}
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function heartEl() {
    var s = document.createElementNS(NS, "svg");
    var u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#heart");
    s.appendChild(u);
    return s;
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  /* Quelques petits cœurs discrets */
  var bd = $("backdrop");
  for (var i = 0; i < 8; i++) {
    var d = document.createElement("div");
    var size = 16 + Math.round(Math.random() * 20);
    d.className = "floaty";
    d.style.left = (4 + Math.random() * 90) + "%";
    d.style.top = (4 + Math.random() * 88) + "%";
    d.style.width = size + "px";
    d.style.height = size + "px";
    d.style.opacity = (0.14 + Math.random() * 0.16).toFixed(2);
    d.style.setProperty("--dur", (6 + Math.random() * 6).toFixed(1) + "s");
    d.style.setProperty("--delay", (-Math.random() * 6).toFixed(1) + "s");
    d.appendChild(heartEl());
    bd.appendChild(d);
  }

  /* Bouton Non qui s'enfuit */
  var no = $("no"), yes = $("yes"), slot = $("slot"), statusEl = $("status");
  var fled = false, dodges = 0;
  var taunts = [
    "Hé, ce bouton est timide.",
    "Il n'aime pas la souris.",
    "Insiste si tu veux, il court vite.",
    "Il paraît que le oui est plus facile à attraper."
  ];
  function flee(px, py) {
    var r = no.getBoundingClientRect();
    if (!fled) {
      slot.style.width = r.width + "px";
      slot.style.height = r.height + "px";
      no.style.width = r.width + "px";
      no.classList.add("fixed");
      no.style.left = r.left + "px";
      no.style.top = r.top + "px";
      fled = true;
    }
    var w = no.offsetWidth, h = no.offsetHeight, pad = 14;
    var maxX = Math.max(pad, window.innerWidth - w - pad);
    var maxY = Math.max(pad, window.innerHeight - h - pad);
    var yr = yes.getBoundingClientRect();
    var best = null, bestD = -1;
    for (var k = 0; k < 40; k++) {
      var x = rand(pad, maxX), y = rand(pad, maxY);
      var overlapsYes = x < yr.right + 12 && x + w > yr.left - 12 && y < yr.bottom + 12 && y + h > yr.top - 12;
      if (overlapsYes) continue;
      var dist = Math.hypot(x + w / 2 - px, y + h / 2 - py);
      if (dist > bestD) { bestD = dist; best = { x: x, y: y }; }
    }
    if (!best) best = { x: pad, y: pad };
    no.style.left = best.x + "px";
    no.style.top = best.y + "px";
    dodges++;
    if (dodges % 3 === 0) statusEl.textContent = taunts[(dodges / 3 - 1) % taunts.length];
  }
  document.addEventListener("pointermove", function (e) {
    if (no.hidden) return;
    var r = no.getBoundingClientRect();
    var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 90) flee(e.clientX, e.clientY);
  });
  no.addEventListener("pointerdown", function (e) { e.preventDefault(); flee(e.clientX, e.clientY); });
  no.addEventListener("touchstart", function (e) { e.preventDefault(); var t = e.touches[0]; flee(t.clientX, t.clientY); }, { passive: false });
  no.addEventListener("click", function (e) { e.preventDefault(); flee(e.clientX || 0, e.clientY || 0); });
  no.addEventListener("focus", function () { var r = no.getBoundingClientRect(); flee(r.left + r.width / 2, r.top + r.height / 2); });
  window.addEventListener("resize", function () {
    if (!fled) return;
    var w = no.offsetWidth, h = no.offsetHeight;
    no.style.left = Math.min(parseFloat(no.style.left), Math.max(14, window.innerWidth - w - 14)) + "px";
    no.style.top = Math.min(parseFloat(no.style.top), Math.max(14, window.innerHeight - h - 14)) + "px";
  });

  /* Pluie de cœurs */
  function burst(x, y) {
    if (reduceMotion) return;
    for (var i = 0; i < 22; i++) {
      var b = document.createElement("div");
      b.className = "burst";
      var a = Math.random() * Math.PI * 2, dist = rand(80, 240);
      b.style.left = x + "px"; b.style.top = y + "px";
      b.style.setProperty("--dx", Math.cos(a) * dist + "px");
      b.style.setProperty("--dy", Math.sin(a) * dist - 60 + "px");
      b.style.setProperty("--rot", rand(-40, 40) + "deg");
      b.appendChild(heartEl());
      document.body.appendChild(b);
      (function (el) { setTimeout(function () { el.remove(); }, 1400); })(b);
    }
  }

  var picker = $("picker"), meme = $("meme"), choices = $("choices");
  yes.addEventListener("click", function () {
    var r = yes.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    no.hidden = true;
    choices.hidden = true;
    meme.hidden = false;
    statusEl.textContent = "OOOHHHHHH MON AMOUR, tu voudrais quaannnndddd";
    picker.open = true;
    picker.classList.remove("pulse");
    void picker.offsetWidth;
    picker.classList.add("pulse");
  });

  /* Calendrier du 25 octobre 2026 au 25 octobre 2200 */
  var MIN = new Date(2026, 9, 25), MAX = new Date(2200, 9, 25);
  var MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  var fmt = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  var picked = {}, forever = false, excluded = {};
  var fmtDay = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  function isOn(key) { return forever ? !excluded[key] : !!picked[key]; }
  var today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var viewY = MIN.getFullYear(), viewM = MIN.getMonth();
  if (today >= MIN && today <= MAX) { viewY = today.getFullYear(); viewM = today.getMonth(); }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function iso(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
  function fromIso(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function ym(y, m) { return y * 12 + m; }
  var LO = ym(MIN.getFullYear(), MIN.getMonth()), HI = ym(MAX.getFullYear(), MAX.getMonth());

  var monthSel = $("month"), yearSel = $("year"), grid = $("grid"), prev = $("prev"), next = $("next");
  for (var y = MIN.getFullYear(); y <= MAX.getFullYear(); y++) {
    var o = document.createElement("option"); o.value = y; o.textContent = y; yearSel.appendChild(o);
  }
  MONTHS.forEach(function (n, i) {
    var o = document.createElement("option"); o.value = i; o.textContent = n.charAt(0).toUpperCase() + n.slice(1); monthSel.appendChild(o);
  });

  function clampView() {
    var v = ym(viewY, viewM);
    if (v < LO) v = LO;
    if (v > HI) v = HI;
    viewY = Math.floor(v / 12); viewM = v % 12;
  }

  function renderGrid() {
    clampView();
    yearSel.value = viewY;
    Array.prototype.forEach.call(monthSel.options, function (o, i) {
      var v = ym(viewY, i);
      o.disabled = v < LO || v > HI;
    });
    monthSel.value = viewM;
    prev.disabled = ym(viewY, viewM) <= LO;
    next.disabled = ym(viewY, viewM) >= HI;

    var offset = (new Date(viewY, viewM, 1).getDay() + 6) % 7;
    var days = new Date(viewY, viewM + 1, 0).getDate();
    grid.textContent = "";
    var tr = document.createElement("tr");
    for (var e = 0; e < offset; e++) tr.appendChild(document.createElement("td"));
    for (var d = 1; d <= days; d++) {
      if (tr.children.length === 7) { grid.appendChild(tr); tr = document.createElement("tr"); }
      var date = new Date(viewY, viewM, d), key = iso(viewY, viewM, d);
      var td = document.createElement("td"), b = document.createElement("button");
      b.type = "button"; b.className = "day"; b.textContent = d;
      b.setAttribute("aria-label", fmt.format(date));
      b.disabled = date < MIN || date > MAX;
      if (isOn(key)) { b.classList.add("on"); b.setAttribute("aria-pressed", "true"); } else b.setAttribute("aria-pressed", "false");
      b.dataset.key = key;
      td.appendChild(b); tr.appendChild(td);
    }
    while (tr.children.length < 7) tr.appendChild(document.createElement("td"));
    grid.appendChild(tr);
  }

  var chosenEl = $("chosen"), reply = $("reply"), copyBtn = $("copy"), doneBtn = $("done"), foreverBtn = $("forever"), finalImg = $("final");
  function addChip(text, onRemove, removeLabel) {
    var chip = document.createElement("span"); chip.className = "chip";
    var label = document.createElement("span"); label.textContent = text;
    var x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", removeLabel);
    x.addEventListener("click", onRemove);
    chip.appendChild(label); chip.appendChild(x); chosenEl.appendChild(chip);
  }
  function renderChosen() {
    chosenEl.textContent = "";
    var hasSel = false;
    if (forever) {
      hasSel = true;
      addChip("Tous les jours, pour l'éternité", function () { forever = false; excluded = {}; renderAll(); }, "Annuler pour l'éternité");
      var ex = Object.keys(excluded).sort();
      ex.forEach(function (k) {
        addChip("Sauf le " + fmt.format(fromIso(k)), function () { delete excluded[k]; renderAll(); }, "Remettre " + fmt.format(fromIso(k)));
      });
      var msg = "Oui, pour l'éternité ! Je suis libre tous les jours du " + fmtDay.format(MIN) + " au " + fmtDay.format(MAX) + ".";
      if (ex.length) msg += "\nSauf :\n" + ex.map(function (k) { return "- " + fmt.format(fromIso(k)); }).join("\n");
      reply.value = msg;
    } else {
      var keys = Object.keys(picked).sort();
      hasSel = keys.length > 0;
      keys.forEach(function (k) {
        addChip(fmt.format(fromIso(k)), function () { delete picked[k]; renderAll(); }, "Enlever " + fmt.format(fromIso(k)));
      });
      reply.value = hasSel ? "Oui, avec grand plaisir ! Je suis libre ces jours-là :\n" + keys.map(function (k) { return "- " + fmt.format(fromIso(k)); }).join("\n") : "";
    }
    copyBtn.disabled = !hasSel;
    doneBtn.disabled = !hasSel;
    foreverBtn.setAttribute("aria-pressed", forever ? "true" : "false");
    foreverBtn.classList.toggle("on", forever);
    if (!hasSel) finalImg.hidden = true;
  }
  function renderAll() { renderGrid(); renderChosen(); }

  grid.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".day") : null;
    if (!b || b.disabled) return;
    var k = b.dataset.key;
    var set = forever ? excluded : picked; if (set[k]) delete set[k]; else set[k] = true;
    renderAll();
    var again = grid.querySelector('[data-key="' + k + '"]');
    if (again) again.focus();
  });
  prev.addEventListener("click", function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderGrid(); });
  next.addEventListener("click", function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderGrid(); });
  monthSel.addEventListener("change", function () { viewM = +monthSel.value; renderGrid(); });
  yearSel.addEventListener("change", function () { viewY = +yearSel.value; renderGrid(); });

  copyBtn.addEventListener("click", function () {
    var reset = function (msg) { copyBtn.textContent = msg; setTimeout(function () { copyBtn.textContent = "Copier le message"; }, 2200); };
    var fallback = function () { reply.focus(); reply.select(); reset("Sélectionné, copie-le"); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(reply.value).then(function () { reset("Copié, envoie-le moi !"); }, fallback);
      else fallback();
    } catch (err) { fallback(); }
  });

  foreverBtn.addEventListener("click", function () {
    forever = !forever;
    excluded = {};
    if (forever) {
      picked = {};
      var r = foreverBtn.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    }
    renderAll();
  });
  doneBtn.addEventListener("click", function () {
    if (doneBtn.disabled) return;
    finalImg.hidden = false;
    var r = doneBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    finalImg.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  });

  renderAll();
})();
</script>

</body></html>
